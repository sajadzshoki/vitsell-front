# Server folder that already contains `.output` (no Nuxt source / package.json).
#
#   docker compose -f docker-compose.prebuilt.yml up -d --build

services:
  store:
    image: ${STORE_IMAGE:-vitsell-store:latest}
    build:
      context: .
      dockerfile: Dockerfile.prebuilt
    container_name: store
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      NITRO_PORT: 3000
      NITRO_HOST: 0.0.0.0
      NODE_ENV: production
    ports:
      - '${STORE_PORT:-3000}:3000'

networks:
  default:
    external: true
    name: main
