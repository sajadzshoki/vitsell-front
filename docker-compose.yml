version: '3.8'
services:
  taxi-service:
    image: node:18
    container_name: taxi-service
    restart: always
    volumes:
      - "./:/home/node/app"
    working_dir: '/home/node/app'
    command: bash -c "yarn install && node ./.output/server/index.mjs"

networks:
  default:
    external: true
    name: 'node'
