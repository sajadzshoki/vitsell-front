# Frontend store (SSR). Local / default network.
#
#   docker compose up -d --build
#
# Production (same stack as API, network `main`):
#   docker compose -f docker-compose.prod.yml up -d --build
#
# CI builds the image with the same Dockerfile and build-args, then deploy
# pulls `STORE_IMAGE` and runs this compose.

services:
  store:
    image: ${STORE_IMAGE:-vitsell-store:latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NUXT_PUBLIC_APP_MODE: ${NUXT_PUBLIC_APP_MODE:-store}
        NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-https://api.vitsell.ir/api/v1}
        NUXT_PUBLIC_STORE_URL: ${NUXT_PUBLIC_STORE_URL:-https://vitsell.ir}
        NUXT_PUBLIC_ADMIN_URL: ${NUXT_PUBLIC_ADMIN_URL:-https://seller.vitsell.ir}
        NUXT_PUBLIC_APP_VERSION: ${NUXT_PUBLIC_APP_VERSION:-beta.0.1}
    container_name: vitsell-store
    restart: unless-stopped
    ports:
      - '${STORE_PORT:-3000}:3000'
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      NITRO_PORT: 3000
      NITRO_HOST: 0.0.0.0
      NODE_ENV: production
      NUXT_PUBLIC_APP_MODE: ${NUXT_PUBLIC_APP_MODE:-store}
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-https://api.vitsell.ir/api/v1}
      NUXT_PUBLIC_STORE_URL: ${NUXT_PUBLIC_STORE_URL:-https://vitsell.ir}
      NUXT_PUBLIC_ADMIN_URL: ${NUXT_PUBLIC_ADMIN_URL:-https://seller.vitsell.ir}
      NUXT_PUBLIC_APP_VERSION: ${NUXT_PUBLIC_APP_VERSION:-beta.0.1}
